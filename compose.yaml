services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      # Loopback only: the interface has no authentication. Change deliberately for a server.
      - "127.0.0.1:${PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
